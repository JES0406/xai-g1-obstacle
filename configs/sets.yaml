# Evaluation sets.
# A seed fixes the user command and the box layout (env.reset(seed=...)).
# Train-ID does not exist: training layouts cannot be rebuilt.

machine: lab-rtx4070ti     # every number in the report comes from this machine
processes: 8
image_episodes_per_set: 20 # image + segmentation mask saved inline, spread over densities

sets:
  validation:
    seeds_from: 1000       # already used by the beca evaluations
    boxes: [0, 10, 20, 30]
    episodes_per_density: 20
  test_id:
    seeds_from: 2000       # never used before
    boxes: [10, 20, 30]
    episodes_per_density: 100
  test_id_0:
    seeds_from: 2000
    boxes: [0]
    episodes_per_density: 50
  test_ood_box_colour:     # geom_rgba of the boxes: "detects red" vs "detects obstacle"
    like: test_id
    variant: box_colour
  test_ood_floor_tint:     # mat_rgba of the floor
    like: test_id
    variant: floor_tint
  test_ood_lighting:       # spotlight position/intensity, no shadows, headlight
    like: test_id
    variant: lighting

baselines:                 # on Test-ID seeds; 17 x 3 densities = 51 episodes per kind
  seeds_like: test_id
  episodes_per_density: 17
  boxes: [10, 20, 30]
  kinds:                   # sets baseline_<kind>
    - walker               # (a) no CNN: follows the command, does not avoid
    - black                # (b) black image: an OOD input, not "the policy without vision"
    - noise                # (c) uniform noise image, new every step
    - mask_top             # behaviour test: hide the top-10 % Grad-CAM region every step
    - mask_random          # control: same-shaped region at a random offset

interventions:             # test time, no retraining: transform the image before the policy; same seeds as `like`
  int_hue_box_colour:      # recolour strongly saturated pixels to the training red -> blue boxes
    like: test_ood_box_colour
    transform: hue_canon
  int_hue_test_id:         # must not hurt in distribution (17 x 3 = 51 episodes)
    like: test_id
    transform: hue_canon
    episodes_per_density: 17
  int_norm_floor_tint:     # floor pixels' colour brought to the training floor colour (configs/colour_reference.json)
    like: test_ood_floor_tint
    transform: floor_norm
  int_norm_test_id:
    like: test_id
    transform: floor_norm
    episodes_per_density: 17

# Concrete OOD values are set in src/scenarios.py (day 1); they must stay
# disjoint from any fine-tune domain randomisation ranges.
